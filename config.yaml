server:
  addr: ":6379"
  read_timeout: 300
  write_timeout: 300
  auth: secretpassword

persistence:
  aof:
    enabled: true
    filename: "appendonly.aof"
    rewrite_interval: 60
  rdb:
    enabled: true
    filename: "dump.rdb"

datastructure:
  expiration:
    max_sample_size: 20
    max_sample_rounds: 3
    check_interval: 1

memory:
  key_limit: 5000000
  evict_strategy: "lru"

logging:
  level: "info"
  verbose_persistence: true
