server:
  addr: ":6379"
  read_timeout: 300
  write_timeout: 300
  auth: secretpassword

replication:
  role: "primary"
  primary_addr: ""
  username: ""
  password: ""
  backlog_size: 1048576

persistence:
  wal:
    enabled: true
    filename: "valkeydb.wal"
    rewrite_interval: 3600
    max_size_mb: 64
  snapshot:
    enabled: false
    filename: "dump.vksp"

datastructure:
  expiration:
    check_interval: 1

memory:
  key_limit: 5000000
  evict_strategy: "lru"

logging:
  level: "info"
  verbose_persistence: true
