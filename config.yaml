server:
  addr: ":6379"
  read_timeout: 300
  write_timeout: 300
  auth: secretpassword
  resp:
    max_bulk_length: 16777216
    max_array_length: 1024
    max_depth: 8
    max_line_length: 65536

replication:
  role: "primary"
  primary_addr: ""
  username: ""
  password: ""
  backlog_size: 1048576

persistence:
  wal:
    enabled: true
    filename: "memkv.wal"
    rewrite_interval: 3600
    max_size_mb: 64
  snapshot:
    enabled: false
    filename: "dump.vksp"

datastructure:
  expiration:
    check_interval: 1

memory:
  max_keys: 5000000
