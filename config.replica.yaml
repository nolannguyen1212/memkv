server:
  addr: ":6380"
  read_timeout: 300
  write_timeout: 300
  auth: secretpassword
  resp:
    max_bulk_length: 16777216
    max_array_length: 1024
    max_depth: 8
    max_line_length: 65536

replication:
  role: "replica"
  primary_addr: "127.0.0.1:6379"
  username: "default"
  password: "secretpassword"
  backlog_size: 1048576

persistence:
  wal:
    enabled: true
    filename: "replica.wal"
    rewrite_interval: 3600
    max_size_mb: 64
  snapshot:
    enabled: false
    filename: "dump-replica.vksp"

datastructure:
  expiration:
    check_interval: 1

memory:
  key_limit: 5000000
  evict_strategy: "lru"
